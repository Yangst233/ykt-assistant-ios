name: Build iOS
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and iOS SDKs
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcode_version=$(xcodebuild -version | awk 'NR == 1 {print $2}')
          device_sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          simulator_sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          printf 'Xcode %s, iOS device SDK %s, iOS simulator SDK %s\n' "$xcode_version" "$device_sdk" "$simulator_sdk"
          [[ ${xcode_version%%.*} -ge 26 && ${device_sdk%%.*} -ge 26 && ${simulator_sdk%%.*} -ge 26 ]]
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          python3 -c 'import plistlib; assert "UIDesignRequiresCompatibility" not in plistlib.load(open("Generated/Info.plist", "rb"))'
      - name: Test on iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          candidates = [
              (tuple(map(int, runtime.split(".iOS-")[-1].split("-"))), device["udid"])
              for runtime, devices in runtimes.items() if ".iOS-" in runtime
              for device in devices if device["name"].startswith("iPhone")
          ]
          candidates = [candidate for candidate in candidates if candidate[0][0] >= 26]
          if not candidates:
              sys.exit("No installed iOS 26 or newer iPhone simulator runtime")
          print(max(candidates)[1])
          ')
          xcodebuild test -scheme RainAssistant -destination "platform=iOS Simulator,id=$device" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee simulator.log
      - name: Build unsigned arm64 app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -scheme RainAssistant -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath Build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee device.log
          mkdir -p Package/Payload
          app=Build/Build/Products/Release-iphoneos/RainAssistant.app
          test "$(lipo -archs "$app/RainAssistant")" = arm64
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as stream:
              info = plistlib.load(stream)
          assert "UIDesignRequiresCompatibility" not in info
          assert info["MinimumOSVersion"] == "17.0", info["MinimumOSVersion"]
          sdk = info["DTSDKName"]
          assert sdk.startswith("iphoneos") and int(sdk.removeprefix("iphoneos").split(".")[0]) >= 26, sdk
          print(f"IPA uses {sdk} with minimum iOS {info['MinimumOSVersion']}")
          PY
          ditto "$app" Package/Payload/RainAssistant.app
          (cd Package && /usr/bin/zip -qry RainAssistant-arm64-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: RainAssistant-arm64-unsigned
          path: ios/Package/RainAssistant-arm64-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/simulator.log
            ios/device.log
