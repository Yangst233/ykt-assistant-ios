name: RainAssistant
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: "0.9.19"
targets:
  RainAssistant:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ykt.assistant.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 雨课堂助手
        UILaunchScreen: {}
        NSCameraUsageDescription: 扫描雨课堂签到二维码。
        NSPhotoLibraryAddUsageDescription: 将选定的课件图片保存到照片。
  RainAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RainAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ykt.assistant.ios.tests
schemes:
  RainAssistant:
    build:
      targets:
        RainAssistant: all
    test:
      targets:
        - RainAssistantTests
